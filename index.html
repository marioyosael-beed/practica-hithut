<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>biemvenido a mi web</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .content {
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            display: none;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .welcome-card input {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            margin: 16px 0;
            font-size: 16px;
        }

        .welcome-card button {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            background: #00aaff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="overlay" id="welcomeOverlay">
        <div class="welcome-card">
            <h2>Bienvenido</h2>
            <p>Ingresa tu nombre para continuar.</p>
            <input type="text" id="userName" placeholder="Tu nombre" />
            <button id="startButton">Ingresar y ver la página</button>
        </div>
    </div>

    <div class="content" id="mainContent">
        <h1>Hola, bienvenido a mi web</h1>
        <h2>Esta es una web de tarea</h2>
        <p>Hola <span id="displayName">amigo</span>, soy Mario y espero que te guste mi web.</p>
        <button id="exitButton" style="margin-top: 20px; padding: 10px 20px; background: #ff4444; color: white; border: none; border-radius: 10px; cursor: pointer;">Salir de la web</button>
    </div>

    <script>
        const button = document.getElementById('startButton');
        const overlay = document.getElementById('welcomeOverlay');
        const content = document.getElementById('mainContent');
        const displayName = document.getElementById('displayName');
        const exitButton = document.getElementById('exitButton');

        button.addEventListener('click', () => {
            const name = document.getElementById('userName').value.trim();

            if (!name) {
                alert('Por favor ingresa tu nombre.');
                return;
            }

            displayName.textContent = name;
            overlay.style.display = 'none';
            content.style.display = 'block';
        });

        exitButton.addEventListener('click', () => {
            content.style.display = 'none';
            overlay.style.display = 'flex';
            document.getElementById('userName').value = '';
        });
    </script>
</body>
